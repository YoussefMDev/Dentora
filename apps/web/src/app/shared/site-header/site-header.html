<header class="header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Dentora home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 34 34" fill="none"><path d="M7 17c0-6 4-10 10-10s10 4 10 10-4 10-10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M11 18c2.3 0 3.5-1 5-3.5 1.5 2.5 2.7 3.5 5 3.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </span>
      <span>Dentora</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/about" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }">About</a>
      <a routerLink="/services" routerLinkActive="nav-active">Services</a>
      <a routerLink="/gallery" routerLinkActive="nav-active">Gallery</a>
      <a class="nav-contact" routerLink="/contact" routerLinkActive="nav-active">Contact</a>
    </nav>
    <a class="header-cta" routerLink="/book">Book a visit <span aria-hidden="true">↗</span></a>
  </div>
</header>
